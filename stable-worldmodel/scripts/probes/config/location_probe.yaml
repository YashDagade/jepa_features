defaults:
  - _self_

device: cuda

world_model:
  checkpoint: ???
  cache_dir: ${oc.env:STABLEWM_HOME,null}

dataset:
  source_hdf5: null
  expected_split_counts:
    fit: 512
    validation: 128
    test: 256

location_probe:
  sidecar: ???
  image_size: 224
  batch_size: 128
  num_workers: 8
  expected_feature_width: null
