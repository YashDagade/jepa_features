defaults:
  - _self_
hydra:
  output_subdir: null
  run:
    dir: .
output_dir: ${oc.env:STABLEWM_HOME}/runs/tunnel_rooms_collection
dataset_cache_dir: ${oc.env:STABLEWM_HOME}
collection_mode: manifest_first
conditions: [paired_color]
num_leaves: 2
scenario_seed: 41021
policy_seed: 41021
num_scenarios: 10000
max_attempts_per_condition: 20
log_every: 100
overwrite: false
resume: true
record_videos: false
video_steps: 500
agent_speed: 5.0
agent_render_radius: 9
marker_appearance:
  marker_style: outline
  marker_width: 15
  marker_height: 15
policy:
  action_noise: 2.0
  action_repeat_prob: 0.05
world:
  num_envs: 1
  max_episode_steps: 500
  image_shape: [224, 224]
dataset_names:
  paired_color: tunnel_room_color
prefix:
  enable: false
  output_dir: null
  num_scenarios: 0
  dataset_names:
    paired_color: tunnel_room_color
eval_scenarios:
  enable: true
  scenario_seed: 852031
  episodes_per_rank: 25
  wandb_videos_per_rank: 3
  eval_budget: 400
  max_candidates: 100000
