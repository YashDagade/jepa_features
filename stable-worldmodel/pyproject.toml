[project]
name = "stable-worldmodel"
version = "0.1.0"
description = "LeWM cue-binding study in Tunnel Rooms"
readme="README.md"
license="MIT"
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "loguru",
  "tabulate",
  "gymnasium",
  "einops",
  "lancedb>=0.30.0",
  "pylance>=4.0.0",
  "pyarrow",
  "pillow",
  "tqdm",
  "typer",
  "rich",
]

[project.scripts]
swm = "stable_worldmodel.cli:app"

[project.optional-dependencies]
train = [
    "transformers>=4.50.0",
    "stable-pretraining>=0.1.7",
    "hydra-core",
    "wandb",
    "scikit-learn",
    "matplotlib",
    "scipy",
]

format = [
    "h5py",
    "hdf5plugin",
    "decord",
    "imageio[ffmpeg]",
]

all = [
    "stable-worldmodel[train,format]",
]

[dependency-groups]
dev = ["pytest", "pytest-cov>=7.0.0", "ruff"]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
source-exclude = [
    "**/.mypy_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.coverage.run]
omit = ["stable_worldmodel/envs/*"]
